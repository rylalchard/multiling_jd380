[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rylalchard-multiling_jd380"
version = "0.1.0"
description = "对内容做归一化与分片比对，找出多语言模型工程师·显存碎片与分配策略上的重复项并按相似度归并"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "rylalchard" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://rylalchard.github.io"
Repository = "https://github.com/rylalchard/multiling_jd380"
Issues = "https://github.com/rylalchard/multiling_jd380/issues"

[project.scripts]
multiling_jd380 = "multiling_jd380:main"

[tool.setuptools]
py-modules = ["multiling_jd380"]
